<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Diary — Studygram</title>
  <meta name="description" content="Tell AI about your study day by text or voice. Get personalized revision topics and gentle encouragement." />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .diary-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: start;
    }

    .ai-result-section { animation: slideInUp 0.5s ease; }

    .topic-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124,58,237,0.1);
      border: 1px solid rgba(124,58,237,0.25);
      border-radius: var(--radius-full);
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--accent-soft);
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition);
    }
    .topic-tag:hover {
      background: rgba(124,58,237,0.2);
      text-decoration: none;
      color: var(--accent-soft);
    }

    .entry-card {
      border-left: 3px solid var(--accent);
      padding: 18px 20px;
    }
    .entry-card .entry-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }
    .entry-card .entry-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .encouragement-card {
      background: linear-gradient(135deg, rgba(124,58,237,0.08), rgba(6,182,212,0.06));
      border: 1px solid rgba(6,182,212,0.2);
      border-radius: var(--radius-lg);
      padding: 22px;
    }

    .voice-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    #voice-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-width: 120px;
    }

    @media (max-width: 800px) {
      .diary-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="toast-container"></div>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-brand" href="../index.html">
    <div class="logo-icon">📚</div>
    <span class="gradient-text">Studygram</span>
  </a>
  <div class="navbar-links">
    <a href="../index.html" aria-label="Home">🏠 <span>Home</span></a>
    <a href="lesson.html" aria-label="Learn">▶️ <span>Learn</span></a>
    <a href="quiz.html" aria-label="Quiz">🧠 <span>Quiz</span></a>
    <a href="diary.html" class="active" aria-label="Diary">📖 <span>Diary</span></a>
    <a href="study.html" aria-label="New Study Set">＋ <span>New Set</span></a>
  </div>
</nav>

<div class="page-wrapper">
<div class="container" style="padding-top:32px; padding-bottom:64px;">

  <!-- PAGE HEADER -->
  <div class="section-header animate-slide-up">
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:12px;">
      <div class="feature-icon emerald" style="width:48px;height:48px;">📖</div>
      <div>
        <h1>Study Diary</h1>
        <p>Describe your day — AI finds what you need to revise and cheers you on.</p>
      </div>
    </div>
    <a class="btn btn-ghost btn-sm" href="../index.html#lily-form">Talk to Lily about your study day</a>
  </div>

  <div class="diary-layout">

    <!-- LEFT: INPUT + AI RESULT -->
    <div>
      <!-- INPUT CARD -->
      <div class="card card-accent-border animate-slide-up" style="margin-bottom:24px;">
        <h2 style="font-size:1rem; margin-bottom:16px;">✍️ How was your study day?</h2>

        <!-- Voice input section -->
        <div class="voice-section">
          <button
            class="btn btn-ghost voice-btn"
            id="voice-btn"
            onclick="toggleVoice()"
            title="Click to speak"
          >
            🎤 Speak
          </button>
          <span id="voice-status">Click to record your voice</span>
        </div>

        <div class="form-group">
          <textarea
            class="form-textarea"
            id="diary-input"
            placeholder="Tell me about your day... What did you learn? What was confusing? How are you feeling about school? There's no pressure — just write naturally."
            style="min-height:180px;"
          ></textarea>
        </div>

        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" onclick="clearEntry()">Clear</button>
          <button class="btn btn-primary" id="analyze-btn" onclick="analyzeEntry()">
            ✨ Analyze My Day
          </button>
        </div>
      </div>

      <!-- AI RESULT (shown after analysis) -->
      <div id="ai-result"></div>
    </div>

    <!-- RIGHT: PAST ENTRIES -->
    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 style="font-size:1rem;">📅 Past Entries</h2>
        <span class="badge badge-emerald" id="entry-count">0 entries</span>
      </div>
      <div id="past-entries"></div>
    </div>

  </div>

</div>
</div>

<script src="../js/storage.js"></script>
<script src="../js/ai.js"></script>
<script src="../js/app.js"></script>
<script src="../js/diary.js"></script>
</body>
</html>
