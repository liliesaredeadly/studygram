<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — Studygram</title>
  <meta name="description" content="Adaptive MCQ quizzes that start easy and get harder, with AI explanations for every answer." />
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* ---- Quiz card — warm parchment with lavender accent ---- */
    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px;
      min-height: 300px;
      box-shadow: var(--shadow-card);
    }

    /* Difficulty badges — colors driven by body.quiz-theme in style.css */
    .difficulty-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: var(--radius-full);
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    /* Default palette — quiz-theme body overrides these for lavender */
    .diff-easy   { background: rgba(92,126,102,0.10);   color: #4E7057; border: 1px solid rgba(92,126,102,0.22); }
    .diff-medium { background: rgba(201,169,110,0.12);  color: #9A7A45; border: 1px solid rgba(201,169,110,0.25); }
    .diff-hard   { background: rgba(185,122,120,0.10);  color: #9C5F5D; border: 1px solid rgba(185,122,120,0.22); }

    .question-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 24px;
      color: var(--text-primary);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    /* Explanation box — lavender-tinted on quiz page (via quiz-theme) */
    .explanation-box {
      background: rgba(155,142,196,0.07);
      border: 1px solid rgba(155,142,196,0.22);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      font-size: 0.875rem;
      line-height: 1.65;
      color: var(--text-secondary);
      font-style: italic;
      animation: slideInUp 0.35s ease;
    }
    .explanation-box strong {
      font-style: normal;
      font-family: 'Jost', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent-soft);
      display: block;
      margin-bottom: 6px;
    }

    /* Score result screen */
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin: 24px 0;
    }
    .result-stat {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 10px;
      text-align: center;
    }
    .result-stat .val {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
      color: var(--text-primary);
    }
    .result-stat .lbl {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: 'Jost', sans-serif;
    }

    /* Completion card ornament */
    .completion-card {
      text-align: center;
      padding: 52px 32px;
    }
    .completion-card .trophy {
      font-size: 3.5rem;
      animation: float 2.5s ease-in-out infinite;
      display: block;
      margin-bottom: 16px;
    }

    @media (max-width: 560px) {
      .quiz-card { padding: 22px 16px; }
      .result-grid { grid-template-columns: 1fr 1fr; }
      .question-text { font-size: 1.1rem; }
    }
  </style>
</head>
<body class="quiz-theme">

<div id="toast-container"></div>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-brand" href="../index.html">
    <div class="logo-icon">📚</div>
    <span class="gradient-text">Studygram</span>
  </a>
  <div class="navbar-links">
    <a href="../index.html" aria-label="Home">🏠 <span>Home</span></a>
    <a href="lesson.html" aria-label="Learn">▶️ <span>Learn</span></a>
    <a href="quiz.html" class="active" aria-label="Quiz">🧠 <span>Quiz</span></a>
    <a href="diary.html" aria-label="Diary">📖 <span>Diary</span></a>
    <a href="study.html" aria-label="New Study Set">＋ <span>New Set</span></a>
  </div>
</nav>

<div class="page-wrapper">
<div class="container" style="padding-top:32px; padding-bottom:64px; max-width:700px;">

  <!-- QUIZ HEADER -->
  <div id="quiz-header" style="display:none; margin-bottom:24px;" class="animate-slide-down">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
      <div>
        <p class="slide-number" id="q-label">QUESTION 1 OF 9</p>
        <h1 id="quiz-topic-name" style="font-size:1.4rem;"></h1>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="resetQuiz()">↩ Change Topic</button>
    </div>
    <div class="progress-bar-wrapper" style="margin-top:14px;">
      <div class="progress-bar-fill" id="quiz-progress" style="width:11%;"></div>
    </div>
  </div>

  <!-- MAIN QUIZ CONTENT -->
  <div id="quiz-content"></div>

</div>
</div>

<script src="../js/storage.js"></script>
<script src="../js/ai.js"></script>
<script src="../js/app.js"></script>
<script src="../js/quiz-order.js"></script>
<script src="../js/quiz.js"></script>
</body>
</html>
