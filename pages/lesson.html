<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Lesson — Studygram</title>
  <meta name="description" content="Watch a short narrated reel from your study material." />
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* ---- Lesson-specific styles ---- */
    .slide-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }
    .slide-card::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .slide-emoji {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }

    .slide-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.25;
    }

    .slide-explanation {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.75;
      flex: 1;
      margin-bottom: 24px;
    }

    .fun-fact-box {
      background: rgba(6, 182, 212, 0.08);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .fun-fact-box .ff-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      margin-top: 1px;
    }
    .fun-fact-box .ff-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    /* Dot indicators */
    .slide-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .dot.active {
      background: var(--accent);
      width: 24px;
      border-radius: var(--radius-full);
    }

    /* Nav buttons */
    .slide-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
    }

    /* Topic picker overlay */
    .topic-picker {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px;
      text-align: center;
    }

    /* Completion screen */
    .completion-card {
      text-align: center;
      padding: 48px 32px;
    }
    .completion-card .trophy {
      font-size: 4rem;
      animation: float 2s ease-in-out infinite;
      display: block;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .slide-card { padding: 28px 20px; min-height: 280px; }
      .slide-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<div id="toast-container"></div>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-brand" href="../index.html">
    <div class="logo-icon">📚</div>
    <span class="gradient-text">Studygram</span>
  </a>
  <div class="navbar-links">
    <a href="../index.html" aria-label="Home">🏠 <span>Home</span></a>
    <a href="lesson.html" class="active" aria-label="Learn">▶️ <span>Learn</span></a>
    <a href="quiz.html" aria-label="Quiz">🧠 <span>Quiz</span></a>
    <a href="diary.html" aria-label="Diary">📖 <span>Diary</span></a>
    <a href="study.html" aria-label="New Study Set">＋ <span>New Set</span></a>
  </div>
</nav>

<div class="page-wrapper">
<div class="container" style="padding-top:32px; padding-bottom:64px; max-width:700px;">

  <!-- TOPIC HEADER (shown after topic picked) -->
  <div id="lesson-header" style="display:none; margin-bottom:24px;" class="animate-slide-down">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
      <div>
        <p class="slide-number" id="slide-number-label"></p>
        <h1 id="lesson-topic-name" style="font-size:1.4rem;"></h1>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="resetLesson()">↩ Change Topic</button>
    </div>

    <!-- Progress bar -->
    <div class="progress-bar-wrapper" style="margin-top:14px;">
      <div class="progress-bar-fill" id="lesson-progress" style="width:20%;"></div>
    </div>
  </div>

  <!-- MAIN CONTENT AREA -->
  <div id="lesson-content"></div>

  <!-- SLIDE DOTS (shown during lesson) -->
  <div class="slide-dots" id="slide-dots" style="display:none;"></div>

</div>
</div>

<script src="../js/storage.js"></script>
<script src="../js/ai.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lesson.js"></script>
</body>
</html>
